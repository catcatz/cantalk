<!DOCTYPE html>
<html lang="yue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🎙️ cantalk</title>
<style>
  :root {
    --bg: #0f0f14; --card: #1a1a24; --accent: #6c5ce7;
    --text: #e0e0e0; --sub: #888; --border: #2a2a3a; --input: #12121c;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; justify-content: center; align-items: center;
    min-height: 100dvh; padding: 12px;
  }
  .container {
    width: 100%; max-width: 500px; background: var(--card);
    border-radius: 20px; padding: 24px 20px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    border: 1px solid var(--border);
    display: flex; flex-direction: column;
    height: 92dvh; max-height: 700px;
  }
  .header { text-align: center; margin-bottom: 16px; }
  .header h1 { font-size: 24px; }
  .header .sub { color: var(--sub); font-size: 12px; margin-top: 2px; }
  .status {
    display: flex; align-items: center; justify-content: center;
    gap: 6px; margin-bottom: 12px; font-size: 12px; color: var(--sub);
  }
  .status .dot { width:7px; height:7px; border-radius:50%; background:#e74c3c; }
  .status .dot.connected { background:#00b894; }
  .chat {
    flex: 1; background: var(--input); border-radius: 14px;
    padding: 14px; overflow-y: auto; margin-bottom: 12px;
    display: flex; flex-direction: column; gap: 8px;
    -webkit-overflow-scrolling: touch;
  }
  .msg {
    padding: 10px 14px; border-radius: 14px;
    max-width: 85%; font-size: 15px; line-height: 1.5;
    animation: fadeIn 0.2s ease; word-break: break-word;
  }
  .msg.user { background: var(--accent); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.assistant { background: #22223a; align-self: flex-start; border-bottom-left-radius: 4px; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  .input-row { display: flex; gap: 8px; }
  .text-input {
    flex: 1; background: var(--input); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px; color: var(--text);
    font-size: 15px; outline: none; min-width: 0;
  }
  .text-input:focus { border-color: var(--accent); }
  .btn {
    border: none; border-radius: 12px; padding: 12px 18px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff;
    white-space: nowrap; transition: opacity 0.2s;
  }
  .btn:active { opacity: 0.8; }
  .btn:disabled { opacity: 0.4; }
  .footer {
    text-align: center; margin-top: 10px;
    font-size: 11px; color: #444;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🎙️ cantalk</h1>
    <div class="sub">廣東話 Voice Agent · Mac 本地</div>
  </div>
  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="status">連接中...</span>
  </div>
  <div class="chat" id="chat"></div>
  <div class="input-row">
    <input class="text-input" id="input" placeholder="打廣東話... (例: 你好我叫小強)" autofocus>
    <button class="btn" id="send" disabled>➤</button>
  </div>
  <div class="footer">VAD → STT → LLM → TTS · cantalk</div>
</div>
<script>
// Auto-detect WebSocket URL: same host, port from server or proxied
const WS_PATH = '/cantalk/ws/v1/realtime';
const WS_URL = (location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host + WS_PATH;
let ws, isConnected = false;

const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const dot = document.getElementById('dot');
const status = document.getElementById('status');

function addMsg(role, text) {
  const d = document.createElement('div');
  d.className = 'msg '+role;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}
function setStatus(ok, txt) {
  isConnected = ok;
  dot.className = 'dot'+(ok?' connected':'');
  status.textContent = txt;
  sendBtn.disabled = !ok;
  input.disabled = !ok;
}

function connect() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => { setStatus(true, '已連接 ✅'); };
  ws.onclose = () => { setStatus(false, '斷線 · 3秒重試'); setTimeout(connect, 3000); };
  ws.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    if (ev.type === 'response.output_audio_transcript.done') {
      addMsg('assistant', ev.transcript);
    } else if (ev.type === 'error') {
      addMsg('assistant', '❌ Error');
    }
  };
  ws.onerror = () => { setStatus(false, '連接失敗 · 3秒重試'); setTimeout(connect, 3000); };
}

function send() {
  const text = input.value.trim();
  if (!text || !isConnected) return;
  addMsg('user', text);
  input.value = '';
  ws.send(JSON.stringify({
    type: 'conversation.item.create',
    item: { type: 'message', role: 'user', content: [{ type: 'input_text', text: text }] }
  }));
  ws.send(JSON.stringify({ type: 'response.create', response: { modalities: ['text'] } }));
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', (e) => { if (e.key==='Enter') send(); });
connect();
</script>
</body>
</html>
