<!DOCTYPE html>
<html lang="yue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🎙️ cantalk</title>
<style>
  :root { --bg:#0f0f14; --card:#1a1a24; --accent:#6c5ce7; --text:#e0e0e0; --sub:#888; --border:#2a2a3a; --input:#12121c; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); display:flex; justify-content:center; align-items:center; min-height:100dvh; padding:8px; }
  .container { width:100%; max-width:500px; background:var(--card); border-radius:20px; padding:16px; box-shadow:0 8px 40px rgba(0,0,0,0.5); border:1px solid var(--border); display:flex; flex-direction:column; height:96dvh; max-height:750px; }
  .header { text-align:center; margin-bottom:6px; }
  .header h1 { font-size:22px; } .header .sub { color:var(--sub); font-size:11px; }
  .status { display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:6px; font-size:11px; color:var(--sub); }
  .dot { width:7px; height:7px; border-radius:50%; background:#e74c3c; display:inline-block; }
  .dot.on { background:#00b894; } .dot.listening { background:#f39c12; animation:pulse 0.6s infinite; }
  @keyframes pulse { 50% { opacity:0.3; } }
  .chat { flex:1; background:var(--input); border-radius:14px; padding:12px; overflow-y:auto; margin-bottom:10px; display:flex; flex-direction:column; gap:8px; -webkit-overflow-scrolling:touch; }
  .msg { padding:10px 14px; border-radius:14px; max-width:88%; font-size:15px; line-height:1.5; animation:fadeIn 0.2s ease; word-break:break-word; }
  .msg.user { background:var(--accent); color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
  .msg.bot { background:#22223a; align-self:flex-start; border-bottom-left-radius:4px; }
  .msg.info { background:transparent; color:var(--sub); align-self:center; font-size:12px; font-style:italic; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  .controls { display:flex; flex-direction:column; gap:8px; }
  .btn {
    border:none; border-radius:14px; padding:14px; font-size:16px; font-weight:600;
    cursor:pointer; transition:all 0.15s; -webkit-tap-highlight-color:transparent;
    user-select:none; touch-action:manipulation;
  }
  .btn-mic { flex:1; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; gap:8px; font-size:18px; }
  .btn-mic:active { background:#5a4bd1; }
  .btn-mic.recording { background:#e74c3c; animation:micPulse 1s infinite; }
  @keyframes micPulse { 0%,100%{box-shadow:0 0 0 0 rgba(231,76,60,0.5)} 50%{box-shadow:0 0 0 14px rgba(231,76,60,0)} }
  .input-row { display:flex; gap:8px; }
  .text-input { flex:1; background:var(--input); border:1px solid var(--border); border-radius:12px; padding:12px; color:var(--text); font-size:15px; outline:none; min-width:0; }
  .text-input:focus { border-color:var(--accent); }
  .btn-send { background:var(--accent); color:#fff; padding:12px 20px; font-size:18px; }
  .btn-send:active { background:#5a4bd1; }
  .btn-send:disabled,.btn-mic:disabled { opacity:0.4; }
  .footer { text-align:center; margin-top:6px; font-size:10px; color:#444; }
</style>
</head>
<body>
<div class="container">
  <div class="header"><h1>🎙️ cantalk</h1><div class="sub">廣東話 Voice Agent · 按住講 · 放開聽</div></div>
  <div class="status"><span class="dot" id="dot"></span><span id="stxt">連接中...</span></div>
  <div class="chat" id="chat"></div>
  <div class="controls">
    <button class="btn btn-mic" id="btnMic" disabled>🎤 按住講野</button>
    <div class="input-row">
      <input class="text-input" id="input" placeholder="或者打廣東話..." disabled>
      <button class="btn btn-send" id="send" disabled>➤</button>
    </div>
  </div>
  <div class="footer">VAD → STT → LLM → TTS · powered by cantalk</div>
</div>

<script>
const WS_URL = (location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/cantalk/ws/v1/realtime';
const SR = 16000;

let ws, connected=false, recording=false;
let audioCtx, stream, processor;
let curBotMsg = null;

const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const btnMic = document.getElementById('btnMic');
const dot = document.getElementById('dot');
const stxt = document.getElementById('stxt');

function addMsg(role,text) {
  if (curBotMsg && role==='bot') { curBotMsg.textContent=text; curBotMsg=null; return; }
  const d=document.createElement('div'); d.className='msg '+role; d.textContent=text;
  chat.appendChild(d); chat.scrollTop=chat.scrollHeight; return d;
}
function status(on,txt) {
  connected=on; dot.className='dot'+(on?' on':'');
  stxt.textContent=txt; btnMic.disabled=!on; sendBtn.disabled=!on; input.disabled=!on;
}

// WebSocket
function connect() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => { status(true,'已連接 ✅ · 按住掣講野'); };
  ws.onclose = () => { status(false,'斷線 · 3秒重試'); setTimeout(connect,3000); };
  ws.onerror = () => { status(false,'重試中...'); };
  ws.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    const t = ev.type;
    if (t === 'response.output_audio_transcript.done') {
      if (curBotMsg) { curBotMsg.textContent = ev.transcript; curBotMsg = null; }
      status(true,'已連接 ✅');
    } else if (t === 'response.done') {
      status(true,'已連接 ✅');
    } else if (t === 'error') {
      addMsg('info','❌ '+JSON.stringify(ev.error).slice(0,200));
      if (curBotMsg) { curBotMsg.remove(); curBotMsg=null; }
      status(true,'已連接 ✅');
    }
  };
}

// Voice: stream continuously, server's VAD auto-detects silence
async function startMic() {
  try {
    audioCtx = new AudioContext({ sampleRate:SR });
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { sampleRate:SR, channelCount:1, echoCancellation:true, noiseSuppression:true }
    });
    const src = audioCtx.createMediaStreamSource(stream);
    processor = audioCtx.createScriptProcessor(4096,1,1);
    src.connect(processor); processor.connect(audioCtx.destination);
    processor.onaudioprocess = (e) => {
      if (!recording || !ws || ws.readyState!==WebSocket.OPEN) return;
      const buf = e.inputBuffer.getChannelData(0);
      const i16 = new Int16Array(buf.length);
      for (let i=0;i<buf.length;i++) i16[i]=Math.max(-32768,Math.min(32767,buf[i]*32768));
      const b64 = btoa(String.fromCharCode(...new Uint8Array(i16.buffer)));
      ws.send(JSON.stringify({ type:'input_audio_buffer.append', audio:b64 }));
    };
  } catch(err) { addMsg('info','🎤 咪高峰被拒'); console.error(err); }
}
function stopMic() {
  recording = false;
  if (stream) { stream.getTracks().forEach(t=>t.stop()); stream=null; }
  if (audioCtx) { audioCtx.close(); audioCtx=null; }
}

btnMic.addEventListener('pointerdown', async () => {
  if (!connected || recording) return;
  recording = true; btnMic.classList.add('recording'); btnMic.textContent='🛑 放開';
  dot.className='dot listening'; stxt.textContent='聽緊你講野...';
  curBotMsg = null;
  await startMic();
});
btnMic.addEventListener('pointerup', () => {
  if (!recording) return;
  btnMic.classList.remove('recording'); btnMic.textContent='🎤 按住講野';
  stopMic();
  // Server VAD will auto-detect silence and trigger response
  curBotMsg = addMsg('bot','...');
  dot.className='dot listening'; stxt.textContent='AI 諗緊...';
});
btnMic.addEventListener('pointerleave', () => { if(recording) btnMic.dispatchEvent(new PointerEvent('pointerup')); });

// Text
function sendText() {
  const text = input.value.trim();
  if (!text || !connected) return;
  addMsg('user', text); input.value='';
  ws.send(JSON.stringify({ type:'conversation.item.create', item:{ type:'message', role:'user', content:[{type:'input_text',text}] } }));
  ws.send(JSON.stringify({ type:'response.create', response:{ modalities:['text'] } }));
  curBotMsg = addMsg('bot','...');
  dot.className='dot listening'; stxt.textContent='AI 諗緊...';
}
sendBtn.addEventListener('click', sendText);
input.addEventListener('keydown', (e) => { if(e.key==='Enter') sendText(); });

connect();
</script>
</body>
</html>
